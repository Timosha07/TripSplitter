services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tripsplitter_v2
      POSTGRES_USER: tripsplitter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tripsplitter -d tripsplitter_v2"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  bot:
    build: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      DATABASE_URL: postgresql://tripsplitter:${POSTGRES_PASSWORD}@db:5432/tripsplitter_v2
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
